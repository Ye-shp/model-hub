name: Test changes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check && npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r agents/requirements.txt -r tools/automation/requirements-test.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m pytest tools/automation/tests -q
