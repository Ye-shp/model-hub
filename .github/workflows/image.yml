name: Build GPU image

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: gpu-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the gateway
        run: |
          npm ci
          npm run check
          npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test the agent workspace and integrations offline
        run: |
          python -m pip install -r agents/requirements.txt -r tools/automation/requirements-test.txt
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m pytest tools/automation/tests -q
      - name: Free runner disk space for the CUDA image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Name the image
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
      - name: Deployment reference
        run: |
          echo "Use this exact image in your Vast template:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  # Separate image-generation box (third slot): Qwen-Image-2.1 on its own GPU.
  image-box:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space for PyTorch
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Name the image
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-image" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/image/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
      - name: Deployment reference
        run: |
          echo "Image box (third slot):" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
